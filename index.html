<style>
/* ─── TOKENS ─── */

  --bg:        #F4F0EC;

  --cta:       #E0851E;

  --bg-subtle: #261F34;
  --accent:    #9A7EFF;
  --accent-s:  #B09AFF;
  --accent-gl: rgba(154,126,255,.12);
  --cta:       #F0A040;
  --cta-h:     #E09030;
  --tx:        #EDE8F8;
  --tx2:       #A49DBB;

/* ─── BASE ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;

  color: var(--tx);
  min-height: 100vh;
  font-size: 14.5px;
  line-height: 1.6;
}

/* ─── SHELL ─── */
.shell {
  display: grid;
  grid-template-columns: 236px 1fr;
  grid-template-rows: 56px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ─── TOPBAR ─── */
.topbar {
  grid-column: 1 / -1;
  background: var(--bg-card);
  border-bottom: 1px solid var(--bd);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  gap: 16px;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 2px;
}
.brand-name {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: -0.03em;
}
.brand-suffix {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--accent);

}
.brand-tag {
  margin-left: 8px;
  font-size: 10px;
  font-weight: 700;

  border: 1px solid var(--pr-bd);

}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.copies-label {

  color: var(--tx3);
}
.copies-label b { color: var(--accent); font-weight: 600; }

.btn-cta-sm {

  font-size: 12.5px;

  padding: 7px 14px;
  border-radius: 7px;
  border: none;
  background: var(--cta);
  color: #fff;
  cursor: pointer;
  text-decoration: none;

}
.btn-cta-sm:hover { background: var(--cta-h); transform: translateY(-1px); }

/* ─── SIDEBAR ─── */
.sidebar {
  background: var(--bg-card);
  border-right: 1px solid var(--bd);
  overflow-y: auto;
  padding: 18px 0 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--bd) transparent;
}

.nav-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--tx3);
  padding: 0 18px 8px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 18px;
  border: none;
  border-left: 3px solid transparent;
  background: transparent;
  text-align: left;
  cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13.5px;
  font-weight: 400;
  color: var(--tx2);
  transition: background .14s, color .14s, border-color .14s;
}
.nav-btn:hover { background: var(--bg-subtle); color: var(--tx); }
.nav-btn.active {
  background: var(--accent-gl);
  color: var(--accent);
  font-weight: 600;
  border-left-color: var(--accent);
}
.nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

.sidebar-bottom {
  margin-top: 20px;
  padding: 14px 16px;
  margin-inline: 10px;
  border-radius: 10px;
  background: var(--accent-gl);
  border: 1px solid var(--pr-bd);
}
.sidebar-bottom-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}
.sidebar-bottom-desc {
  font-size: 11.5px;
  color: var(--tx2);
  line-height: 1.5;
  margin-bottom: 10px;
}
.btn-pack-sm {
  display: block;
  width: 100%;
  text-align: center;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12.5px;
  font-weight: 700;
  padding: 7px 12px;
  border-radius: 7px;
  border: none;
  background: var(--cta);
  color: #fff;
  cursor: pointer;
  text-decoration: none;
  transition: background .15s;
}
.btn-pack-sm:hover { background: var(--cta-h); }

/* ─── MAIN ─── */
main {
  overflow-y: auto;
  padding: 28px 32px 48px;
  scrollbar-width: thin;
  scrollbar-color: var(--bd) transparent;
}

.cat-header { margin-bottom: 20px; }
.cat-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.cat-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--tx);
  line-height: 1.2;
  text-wrap: balance;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.cat-desc { font-size: 13.5px; color: var(--tx2); max-width: 540px; }

/* ─── PROMPT CARDS ─── */
.prompts-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }

.pcard {
  background: var(--bg-card);
  border: 1px solid var(--bd);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color .18s, box-shadow .18s;
}
.pcard:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-gl), var(--shadow); }

.pcard-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 16px;
  cursor: pointer;
  user-select: none;
}
.pcard-use { font-size: 14px; font-weight: 600; color: var(--tx); }
.pcard-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.pcard-tag {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 20px;
  background: var(--bg-subtle);
  color: var(--tx2);
}
.pcard-chevron {
  font-size: 11px;
  color: var(--tx3);
  transition: transform .2s;
  font-style: normal;
}
.pcard.open .pcard-chevron { transform: rotate(180deg); }

.pcard-body {
  display: none;
  padding: 0 16px 16px;
  border-top: 1px solid var(--bd);
  padding-top: 14px;
}
.pcard.open .pcard-body { display: block; }

.prompt-pre {
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.75;
  color: var(--tx2);
  background: var(--pr-bg);
  border: 1px solid var(--pr-bd);
  border-radius: 7px;
  padding: 14px 16px;
  white-space: pre-wrap;
  margin-bottom: 10px;
  overflow-x: auto;
}

.var-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.var-chip {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 20px;
  background: var(--accent-gl);
  color: var(--accent);
  border: 1px solid var(--pr-bd);
}

.pcard-actions { display: flex; gap: 8px; align-items: center; }
.btn-copy {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 13px;
  border-radius: 7px;
  border: 1px solid var(--bd);
  background: var(--bg-card);
  color: var(--tx2);
  cursor: pointer;
  transition: all .15s;
}
.btn-copy:hover { background: var(--accent-gl); border-color: var(--accent); color: var(--accent); }
.btn-copy.done { background: var(--accent-gl); border-color: var(--accent); color: var(--accent); }

.hint { font-size: 11.5px; color: var(--tx3); font-style: italic; }

/* ─── UPSELL BLOCK ─── */
.upsell {
  border: 1.5px solid var(--accent);
  border-radius: 12px;
  padding: 24px;
  background: var(--accent-gl);
  position: relative;
  overflow: hidden;
}
.upsell::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: var(--accent-gl);
  pointer-events: none;
}

.upsell-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}
.upsell-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: -0.02em;
  margin-bottom: 8px;
  text-wrap: balance;
  line-height: 1.2;
}
.upsell-sub {
  font-size: 13.5px;
  color: var(--tx2);
  margin-bottom: 16px;
  max-width: 500px;
}

.upsell-feats {
  list-style: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 24px;
  margin-bottom: 20px;
}
.upsell-feats li {
  font-size: 13px;
  color: var(--tx2);
  display: flex;
  align-items: flex-start;
  gap: 7px;
}
.upsell-feats li::before {
  content: "✓";
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
  margin-top: 1px;
}

.upsell-foot {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.price {
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.price-sym { font-size: 17px; font-weight: 600; color: var(--tx2); }
.price-num {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 38px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.price-note { font-size: 12px; color: var(--tx3); margin-left: 2px; }

.btn-buy {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  padding: 11px 22px;
  border-radius: 8px;
  border: none;
  background: var(--cta);
  color: #fff;
  cursor: pointer;
  text-decoration: none;
  transition: background .15s, transform .1s;
}
.btn-buy:hover { background: var(--cta-h); transform: translateY(-1px); }

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--tx);
  color: var(--bg);
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  z-index: 999;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .2s, transform .2s;
  pointer-events: none;
}
.toast.on { opacity: 1; transform: translateY(0); }

/* ─── MOBILE ─── */
@media (max-width: 620px) {
  .shell {
    grid-template-columns: 1fr;
    grid-template-rows: 54px auto 1fr;
    height: auto;
    overflow: visible;
  }
  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--bd);
    overflow-x: auto;
    overflow-y: visible;
    padding: 10px 0;
    display: flex;
    align-items: center;
    gap: 0;
    white-space: nowrap;
  }
  .nav-label, .sidebar-bottom { display: none; }
  .nav-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    border-left: none;
    border-bottom: 2px solid transparent;
    font-size: 13px;
  }
  .nav-btn.active { border-left-color: transparent; border-bottom-color: var(--accent); }
  main { padding: 20px 16px 40px; overflow: visible; }
  .upsell-feats { grid-template-columns: 1fr; }
  .topbar-right .copies-label { display: none; }
}
</style>

<script>
const DATA = [
  {
    id: 'marketing', icon: '📣', name: 'Marketing y Ventas',
    desc: 'Email en frío, copies persuasivos, propuestas comerciales y guiones de venta.',
    prompts: [
      {
        use: 'Email de ventas en frío (B2B)',
        tag: 'Ventas B2B',
        vars: ['EMPRESA_OBJETIVO','CARGO_DESTINATARIO','MI_PRODUCTO','PROBLEMA_ESPECÍFICO'],
        text:
`Actúa como un experto en ventas B2B con 10 años de experiencia.
Redacta un email en frío para [EMPRESA_OBJETIVO], dirigido a [CARGO_DESTINATARIO].

El email debe:
- Tener un asunto que genere curiosidad sin ser clickbait
- Abrirse con un dato específico sobre la empresa del destinatario
- Presentar [MI_PRODUCTO] como solución a [PROBLEMA_ESPECÍFICO]
- Incluir una prueba social breve (cliente, resultado o cifra concreta)
- Cerrar con una CTA de bajo compromiso (15 min de llamada)

Tono: profesional pero cercano, sin jerga corporativa.
Longitud máxima: 150 palabras. Incluye el asunto.`
      },
      {
        use: 'Descripción de producto para e-commerce',
        tag: 'E-commerce',
        vars: ['NOMBRE_PRODUCTO','PLATAFORMA','DESCRIPCIÓN_BASE','PRECIO','PERFIL_CLIENTE','OBJECIÓN_PRINCIPAL'],
        text:
`Eres un copywriter especializado en e-commerce con enfoque en conversión.
Escribe una descripción para [NOMBRE_PRODUCTO] en [PLATAFORMA].

Datos: descripción base: [DESCRIPCIÓN_BASE] · Precio: [PRECIO] · Cliente: [PERFIL_CLIENTE]

Incluye:
1. Título optimizado con la keyword principal
2. Beneficio clave en la primera línea (no característica)
3. 4 bullets con beneficios medibles y específicos
4. Párrafo de descripción con narrativa emocional breve
5. Respuesta a la objeción más común: [OBJECIÓN_PRINCIPAL]

Evita: "increíble", "revolucionario", "único" y adjetivos vacíos.`
      },
      {
        use: 'Guion de llamada de ventas (método SPIN)',
        tag: 'Ventas',
        vars: ['PRODUCTO_SERVICIO','SECTOR_CLIENTE','PROBLEMA_PRINCIPAL'],
        text:
`Crea un guion de llamada de ventas para [PRODUCTO_SERVICIO] con estructura SPIN.

Sector del cliente: [SECTOR_CLIENTE] · Duración objetivo: 25 minutos
Problema central que resolvemos: [PROBLEMA_PRINCIPAL]

Estructura:
- Apertura (60 s): establece agenda y credibilidad
- Preguntas de Situación (4): entiende el contexto actual
- Preguntas de Problema (3): hace consciente el dolor
- Preguntas de Implicación (2): amplía el impacto del problema
- Transición natural a la presentación de la solución
- Manejo de objeciones: precio, "lo pensaré", tiempo
- Cierre con alternativa (no sí/no)

Tono: consultor, no vendedor.`
      }
    ]
  },
  {
    id: 'rrhh', icon: '👥', name: 'Recursos Humanos',
    desc: 'Ofertas de empleo, entrevistas por competencias, feedback difícil y onboarding.',
    prompts: [
      {
        use: 'Oferta de empleo que atrae talento real',
        tag: 'Selección',
        vars: ['PUESTO','EMPRESA','RANGO_SALARIAL','MODALIDAD','AÑOS_EXP','HABILIDADES','CULTURA_3_PALABRAS'],
        text:
`Eres un especialista en employer branding. Redacta una oferta de empleo para [PUESTO] en [EMPRESA].

Datos: Salario: [RANGO_SALARIAL] · Modalidad: [MODALIDAD] · Exp. requerida: [AÑOS_EXP] años
Habilidades clave: [HABILIDADES] · Cultura: [CULTURA_3_PALABRAS]

La oferta debe:
- Abrirse con por qué este rol importa (impacto, no lista de tareas)
- Describir el día a día real en el puesto (semana tipo)
- Separar requisitos "imprescindibles" de "valoramos"
- Poner lo que ofrecemos ANTES de lo que pedimos
- Usar lenguaje inclusivo y neutro

Evita: "apasionado/a", "ninja", "rockstar", "ambiente dinámico".
Longitud: 400-500 palabras.`
      },
      {
        use: 'Preguntas de entrevista por competencias (STAR)',
        tag: 'Entrevistas',
        vars: ['PUESTO','COMPETENCIA_1','COMPETENCIA_2','COMPETENCIA_3'],
        text:
`Soy responsable de selección. Genera un banco de preguntas para el puesto [PUESTO].

Competencias a evaluar: [COMPETENCIA_1], [COMPETENCIA_2], [COMPETENCIA_3]

Para cada competencia, genera:
- 2 preguntas situacionales (metodología STAR)
- 1 pregunta hipotética ("¿Qué harías si...?")
- Indicadores de respuesta positiva a buscar
- Señales de alerta a identificar

Añade también:
- 3 preguntas para evaluar ajuste cultural
- 2 preguntas que el candidato recordará como distintas

Evita preguntas ilegales o discriminatorias.`
      },
      {
        use: 'Conversación de feedback difícil',
        tag: 'Gestión de personas',
        vars: ['COMPORTAMIENTO','SITUACIÓN_CONCRETA','IMPACTO_OBSERVADO','CAMBIO_ESPERADO'],
        text:
`Actúa como un coach de liderazgo experto en conversaciones difíciles.
Ayúdame a preparar una conversación de feedback.

Comportamiento a abordar: [COMPORTAMIENTO]
Situación concreta (cuándo, dónde): [SITUACIÓN_CONCRETA]
Impacto observado en el equipo/resultados: [IMPACTO_OBSERVADO]
Cambio que necesito: [CAMBIO_ESPERADO]

Genera:
1. Apertura no defensiva (2-3 frases para comenzar)
2. Mensaje central usando el modelo SBI (Situación, Comportamiento, Impacto)
3. Pregunta abierta para escuchar su perspectiva
4. Plan de acción concreto con fecha de seguimiento
5. Cierre que mantenga la relación

Tono: directo y honesto, sin crueldad ni vaguedad.`
      }
    ]
  },
  {
    id: 'freelance', icon: '💼', name: 'Freelancers',
    desc: 'Propuestas, presupuestos, negociación y gestión de clientes difíciles.',
    prompts: [
      {
        use: 'Propuesta comercial ganadora',
        tag: 'Captación de clientes',

let activeCat = 'marketing';

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

  const sb = document.getElementById('sidebar');

    `<button class="nav-btn ${c.id===activeCat?'active':''}" onclick="setcat('${c.id}')">
      <span class="nav-icon">${c.icon}</span><span>${c.name}</span>
    </button>`
  ).join('');
  sb.innerHTML = `
    <div class="nav-label">Categorías</div>
    ${btns}
    <div style="height:16px"></div>
    <div class="sidebar-bottom">
      <div class="sidebar-bottom-title">🎁 Pack Completo</div>
      <div class="sidebar-bottom-desc">80+ prompts · Notion template · Actualizaciones incluidas · Pago único</div>
      <a href="https://mavid.gumroad.com/l/prompts-ia-espanol" target="_blank" class="btn-pack-sm">Conseguirlo por €19 →</a>
    </div>
  `;
}

function renderMain() {
  const cat = DATA.find(c=>c.id===activeCat);
  const cards = cat.prompts.map((p,i) => {
    const isOpen = openCard===i;
    return `
      <div class="pcard ${isOpen?'open':''}" id="pc${i}">
        <div class="pcard-head" onclick="toggle(${i})">
          <span class="pcard-use">${p.use}</span>
          <span class="pcard-right">
            <span class="pcard-tag">${p.tag}</span>
            <i class="pcard-chevron">▾</i>
          </span>
        </div>
        ${isOpen ? `
        <div class="pcard-body">
          <div class="prompt-pre">${esc(p.text)}</div>
          <div class="var-row">${p.vars.map(v=>`<span class="var-chip">[${v}]</span>`).join('')}</div>
          <div class="pcard-actions">
            <button class="btn-copy" id="copy${i}" onclick="copyp(${i},this)">📋 Copiar prompt</button>
            <span class="hint">Reemplaza las variables entre [corchetes]</span>
          </div>
        </div>` : ''}
      </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="cat-header">
      <div class="cat-eyebrow">${cat.icon} ${cat.name}</div>
      <h1 class="cat-title">Prompts listos para usar, sin empezar desde cero</h1>
      <p class="cat-desc">${cat.desc} Haz clic en un prompt para ver el texto completo.</p>

        <li>80+ prompts organizados en 6 categorías</li>
        <li>Plantilla Notion para personalizar y organizar</li>
        <li>Guía de uso: cómo sacar el máximo a cada prompt</li>
        <li>Actualizaciones gratuitas de por vida</li>
        <li>Bonus: 15 prompts de gestión del tiempo</li>
        <li>Acceso inmediato tras la compra</li>
      </ul>
      <div class="upsell-foot">
        <div class="price">
          <span class="price-sym">€</span>
          <span class="price-num">19</span>
          <span class="price-note">pago único</span>
        </div>
        <a href="https://mavid.gumroad.com/l/prompts-ia-espanol" target="_blank" class="btn-buy">Conseguir el pack completo →</a>
      </div>
    </div>
  `;
}

function setcat(id) {
  activeCat = id;
  openCard  = null;
  renderSidebar();
  renderMain();
}

function toggle(i) {
  openCard = openCard===i ? null : i;
  renderMain();
}

function copyp(i, btn) {
  const cat = DATA.find(c=>c.id===activeCat);
  navigator.clipboard.writeText(cat.prompts[i].text).then(()=>{
    toast('✓ Prompt copiado al portapapeles');
    btn.textContent = '✓ Copiado';
    btn.classList.add('done');
    setTimeout(()=>{ btn.textContent='📋 Copiar prompt'; btn.classList.remove('done'); }, 2000);
    if (freeLeft > 0) {
      freeLeft--;
      document.getElementById('count').textContent = freeLeft;
    }
  });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2200);
}
